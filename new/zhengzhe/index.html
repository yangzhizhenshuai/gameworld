<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则替换可视化工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 左侧面板 - 文本处理区 -->
        <div class="panel left-panel">
            <div class="panel-header">
                <h2>📝 文本内容</h2>
                <div class="button-group">
                    <button id="parseBtn" class="btn btn-primary" title="解析文本中的规则">
                        <span class="btn-icon">🔍</span> 解析
                    </button>
                    <button id="copyBtn" class="btn btn-secondary" title="复制文本内容">
                        <span class="btn-icon">📋</span> 复制
                    </button>
                </div>
            </div>
            <div class="textarea-wrapper">
                <textarea id="mainText" placeholder="在此输入或粘贴需要处理的文本...&#10;&#10;💡 提示：&#10;• 输入文本后点击「解析」可自动提取规则&#10;• 规则格式：匹配内容 => 替换内容&#10;• 例如：(错字|别字) => 正确"></textarea>
            </div>
            <div class="help-section">
                <details>
                    <summary>📖 使用说明</summary>
                    <div class="help-content">
                        <p><strong>基本操作：</strong></p>
                        <ol>
                            <li>在左侧输入需要处理的文本</li>
                            <li>在右侧添加或编辑替换规则</li>
                            <li>点击「生成」按钮应用所有规则</li>
                        </ol>
                        <p><strong>规则格式：</strong></p>
                        <ul>
                            <li><code>匹配内容 =&gt; 替换内容</code></li>
                            <li><code>(选项1|选项2) =&gt; 替换</code> - 多选匹配</li>
                            <li><code>内容 =&gt; </code> - 删除匹配内容</li>
                        </ul>
                        <p><strong>特殊字符：</strong></p>
                        <ul>
                            <li><code>\n</code> - 换行符</li>
                            <li><code>\t</code> - 制表符</li>
                            <li><code>\s</code> - 空格</li>
                            <li><code>\\</code> - 反斜杠</li>
                        </ul>
                    </div>
                </details>
            </div>
        </div>

        <!-- 右侧面板 - 规则管理区 -->
        <div class="panel right-panel">
            <div class="panel-header">
                <h2>⚙️ 替换规则</h2>
                <div class="button-group">
                    <button id="loadExampleBtn" class="btn btn-secondary" title="加载示例规则">
                        <span class="btn-icon">📚</span> 示例
                    </button>
                    <button id="generateBtn" class="btn btn-success" title="应用所有规则进行替换">
                        <span class="btn-icon">▶️</span> 生成
                    </button>
                    <button id="clearRulesBtn" class="btn btn-danger" title="清空所有规则">
                        <span class="btn-icon">🗑️</span> 清空
                    </button>
                </div>
            </div>
            <div class="rules-container" id="rulesContainer">
                <!-- 规则列表将在这里动态生成 -->
            </div>
            <div class="add-rule-footer">
                <button id="addRuleBtn" class="btn btn-add-rule" title="添加新规则">
                    <span class="btn-icon">➕</span> 添加规则
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
